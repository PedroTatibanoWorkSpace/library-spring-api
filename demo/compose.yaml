version: '3.8'
services:
  app:
    build: .
    container_name: crud_spring_app
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: crud_spring_db
    environment:
      POSTGRES_USER: pedro
      POSTGRES_PASSWORD: pedroA123
      POSTGRES_DB: tatibano
    ports:
      - "5432:5432"
